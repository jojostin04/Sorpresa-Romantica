<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Una Pregunta Especial ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>¿Quieres ser mi persona favorita para siempre? 💕</h1>

        <div class="buttons">
            <button id="yesBtn">Sí 💖</button>
            <button id="noBtn">No 😢</button>
        </div>

        <p id="mensaje"></p>

        <img id="fotoFinal" src="foto.jpg" 
             style="display:none; margin-top:20px; max-width:300px; border-radius:15px;">
    </div>

    <audio id="musica" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
