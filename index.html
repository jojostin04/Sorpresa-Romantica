<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>San Valentín ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="pantallaInicial">
        <h1>¿Quieres ser mi San Valentín mi ayudina? 💖</h1>

        <div class="buttons">
            <button id="yesBtn">Sí 💕</button>
            <button id="noBtn">No 😢</button>
        </div>
    </div>

    <!-- PANTALLA FINAL -->
    <div class="final" id="pantallaFinal">
        <h1 class="mensajeFinal">¡Sabía que dirías que sí mi ayudina hermosa! 💖✨</h1>
        <img src="nosotros.jpeg" class="fotoFinal">
    </div>

    <!-- MUSICA -->
    <audio id="musica" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
