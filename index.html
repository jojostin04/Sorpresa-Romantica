<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>San Valentín ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>¿Quieres ser mi San Valentín mi ayudina? 💖</h1>

        <div class="buttons">
            <button id="yesBtn">Sí 💕</button>
            <button id="noBtn">No 😢</button>
        </div>

        <p id="mensaje"></p>

        <!-- FOTO FINAL -->
        <img id="fotoFinal"
             src="nosotros.jpeg"
             alt="Nuestra foto"
             class="foto-oculta">
    </div>

    <!-- MUSICA -->
    <audio id="musica" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
